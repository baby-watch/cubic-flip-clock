<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>翻页时钟</title><style>body{font:16px/1.8 system-ui,sans-serif;max-width:720px;margin:32px auto;padding:0 20px;color:#242424}img{width:96px;border-radius:20px}h1{margin-bottom:4px}small{color:#666}</style><img src="main.png" alt="翻页时钟图标"><h1>翻页时钟</h1><small>Cubic · 320×240 · 1.1.0</small><p>用上下半页翻动显示时间，提供黑白、纯白、琥珀、冰蓝、紫晶、奶油、血红七种皮肤。</p><ul><li>左倾保持：切换皮肤。</li><li>右倾保持：显示或隐藏秒。右倾后快速回正：切换原版翻页、余辉和机械回弹。</li><li>年月日、星期、农历和北京时间保持白字。农历支持 1900—2100 年。</li></ul><p>请在设备设置中启用北京时间（UTC+8）并完成校时。已在固件 1.210 上测试。</p></html>
